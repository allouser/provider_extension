<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; padding: 14px 16px; font: 13px/1.5 Poppins, Roboto, sans-serif; color: #202124; }
  h1 { font-size: 14px; margin: 0 0 2px; }
  p.sub { font-size: 11px; color: #5f6368; margin: 0 0 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid #eee; }
  .row .label { font-weight: 600; }
  .row .hint { display: block; font-weight: 400; font-size: 11px; color: #5f6368; }
  .pill { border: none; border-radius: 20px; padding: 7px 14px; font: 700 12px/1 inherit; color: #fff; cursor: pointer; min-width: 64px; }
  .pill.on { background: #188038; }
  .pill.off { background: #9aa0a6; }
  p.note { font-size: 11px; color: #5f6368; margin: 12px 0 0; }
</style>
</head>
<body>
  <h1>Provider Detail Quick Copy</h1>
  <p class="sub">Works only on app.allocabs.com provider pages.</p>
  <div class="row">
    <span class="label">Copy buttons<span class="hint">Name / ID / Email / Mobile</span></span>
    <button id="copyToggle" class="pill on" type="button">ON</button>
  </div>
  <div class="row">
    <span class="label">Row &rarr; New Tab<span class="hint">Provider list rows</span></span>
    <button id="rowToggle" class="pill on" type="button">ON</button>
  </div>
  <p class="note">Changes apply instantly &mdash; no refresh needed.</p>
  <script src="popup.js"></script>
</body>
</html>
